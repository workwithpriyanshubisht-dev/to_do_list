<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-shell {
            width: 100%;
            max-width: 720px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
            padding: 16px 22px;
            color: #ffffff;
            background: linear-gradient(110deg, #0f766e, #2563eb);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(15, 118, 110, 0.25);
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            list-style: none;
        }

        .nav-links a {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .todo-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #task-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #task-input:focus {
            border-color: #8ec5fc;
        }

        #add-btn {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        #add-btn:hover {
            background-color: #5b4bc4;
        }

        #task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #6c5ce7;
            transition: all 0.3s ease;
        }

        .task-item.completed {
            border-left-color: #2ecc71;
            background: #f0fbf5;
            opacity: 0.7;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #7f8c8d;
        }

        .task-text {
            flex: 1;
            cursor: pointer;
            margin-right: 10px;
            font-size: 16px;
            word-break: break-all;
        }

        .delete-btn {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background-color: #e84393;
        }

        @media (max-width: 480px) {
            .navbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                gap: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <nav class="navbar" aria-label="Main navigation">
            <div class="brand">TaskFlow</div>
            <ul class="nav-links">
                <li><a href="#task-list">Tasks</a></li>
                <li><a href="#task-input">Add Task</a></li>
            </ul>
        </nav>

        <div class="todo-container">
            <h2>My To-Do List</h2>
            
            <div class="input-section">
                <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
                <button id="add-btn">Add</button>
            </div>

            <ul id="task-list">
                <!-- Tasks will be added here dynamically -->
            </ul>
        </div>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');

        // Add Task Function
        function addTask() {
            const taskInputValue = taskInput.value.trim();

            if (taskInputValue === '') {
                alert('Please enter a task!');
                return;
            }

            // Create list item (li)
            const li = document.createElement('li');
            li.className = 'task-item';

            // Create span for task text
            const taskText = document.createElement('span');
            taskText.className = 'task-text';
            taskText.innerText = taskInputValue;
            
            // Toggle complete on click
            taskText.addEventListener('click', () => {
                li.classList.toggle('completed');
            });

            // Create delete button
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerText = 'Delete';
            
            // Delete task on click
            deleteBtn.addEventListener('click', () => {
                li.remove();
            });

            // Append elements
            li.appendChild(taskText);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            // Clear input box
            taskInput.value = '';
            taskInput.focus();
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);

        // Allow pressing "Enter" key to add task
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>

</body>
</html>
