<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern To-Do List (Persistent)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <nav class="navbar" aria-label="Main navigation">
      <div class="brand">TaskFlow</div>
      <div class="nav-actions">
        <ul class="nav-links">
          <li><a href="#task-list">Tasks</a></li>
          <li><a href="#task-input">Add Task</a></li>
        </ul>
        <button id="color-btn" type="button" aria-label="Change navbar color">Change Color</button>
      </div>
    </nav>
    <div class="todo-container">
      <h2>My To-Do List</h2>
      <div class="input-section">
        <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
        <button id="add-btn">Add</button>
      </div>
      <ul id="task-list"><!-- Managed Dynamically --></ul>
    </div>
  </div>

  <script>
    const taskInput = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const colorBtn = document.getElementById('color-btn');
    const themes = ['', 'theme-sunset', 'theme-forest'];
    let themeIndex = 0;

    // Fetch existing tasks from database on startup
    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        const tasks = await res.json();
        taskList.innerHTML = '';
        tasks.forEach(task => renderTaskElement(task));
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    // Dom Creation separation
    function renderTaskElement(task) {
      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      li.dataset.id = task._id;

      const taskText = document.createElement('span');
      taskText.className = 'task-text';
      taskText.innerText = task.text;

      taskText.addEventListener('click', () => toggleTask(task._id, li));

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerText = 'Delete';
      deleteBtn.addEventListener('click', () => deleteTask(task._id, li));

      li.appendChild(taskText);
      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    }

    // Create via API
    async function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const newTask = await res.json();
        renderTaskElement(newTask);
        taskInput.value = '';
        taskInput.focus();
      } catch (err) {
        console.error('Error saving task:', err);
      }
    }

    // Toggle status via API
    async function toggleTask(id, element) {
      try {
        const res = await fetch(`/api/tasks/${id}`, { method: 'PATCH' });
        if (res.ok) {
          element.classList.toggle('completed');
        }
      } catch (err) {
        console.error('Error updating task:', err);
      }
    }

    // Delete via API
    async function deleteTask(id, element) {
      try {
        const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        if (res.ok) {
          element.remove();
        }
      } catch (err) {
        console.error('Error deleting task:', err);
      }
    }

    // Color switcher
    colorBtn.addEventListener('click', () => {
      document.body.classList.remove(...themes.filter(Boolean));
      themeIndex = (themeIndex + 1) % themes.length;
      document.body.classList.add(themes[themeIndex]);
      colorBtn.textContent = themeIndex === 0 ? 'Change Color' : 'Color ' + (themeIndex + 1);
    });

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

    // Initial Load
    fetchTasks();
  </script>
</body>
</html>
